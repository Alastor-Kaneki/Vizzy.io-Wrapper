name: GitDroid 0.2.0 temporary build

on:
  pull_request:
    paths:
      - .gitdroid-020-build-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gitdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out GitDroid feature branch
        uses: actions/checkout@v4
        with:
          repository: Alastor-Kaneki/AIO-FOSS-App-Store
          ref: feature/shizuku-installed-previews
          path: GitDroid

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build GitDroid debug APK
        working-directory: GitDroid
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload GitDroid APK
        uses: actions/upload-artifact@v4
        with:
          name: GitDroid-0.2.0-debug
          path: GitDroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
