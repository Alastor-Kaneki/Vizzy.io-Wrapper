name: GitDroid 0.2.1 temporary build

on:
  pull_request:
    paths:
      - .gitdroid-021-build-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gitdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out GitDroid installer fix
        uses: actions/checkout@v4
        with:
          repository: Alastor-Kaneki/AIO-FOSS-App-Store
          ref: 475716767362440c375a29c3e3c50c78d0ab6ff5
          path: GitDroid

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build GitDroid debug APK
        working-directory: GitDroid
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage signing tools
        shell: bash
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/

      - name: Upload GitDroid APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: GitDroid-0.2.1-build
          path: |
            GitDroid/app/build/outputs/apk/debug/app-debug.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
          if-no-files-found: error
          retention-days: 7
