name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/native-editor-foundation
          fetch-depth: 0

      - name: Apply native source compile fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path('app/src/main/java/dev/alastorkaneki/vizzywrapper/NativeRenderer.java')
          text = renderer.read_text()
          text = text.replace(
              'catch (IOException | SecurityException | RuntimeException e)',
              'catch (IOException | RuntimeException e)'
          )
          text = text.replace(
              'try { retriever.release(); } catch (RuntimeException ignored) { }',
              'try { retriever.release(); } catch (IOException | RuntimeException ignored) { }'
          )
          renderer.write_text(text)

          capabilities = Path('app/src/main/java/dev/alastorkaneki/vizzywrapper/ExportCapabilities.java')
          text = capabilities.read_text()
          text = text.replace('video.getSupportedBitrates()', 'video.getBitrateRange()')
          text = text.replace('Range<Double> frameRates', 'Range<Integer> frameRates')
          text = text.replace('frameRates.contains((double) fps)', 'frameRates.contains(fps)')
          capabilities.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/alastorkaneki/vizzywrapper/NativeRenderer.java \
                  app/src/main/java/dev/alastorkaneki/vizzywrapper/ExportCapabilities.java
          if ! git diff --cached --quiet; then
            git commit -m "Fix Android codec capability types"
            git push origin HEAD:agent/native-editor-foundation
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Vizzy.io-Native-v2.0.0-alpha1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizzy.io-Native-v2.0.0-alpha1
          path: Vizzy.io-Native-v2.0.0-alpha1.apk
          if-no-files-found: error
          retention-days: 90
