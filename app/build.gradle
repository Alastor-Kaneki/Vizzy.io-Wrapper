plugins {
    id 'com.android.application'
}

import java.util.Base64

def encodedSigningKey = rootProject.file('keystore/vizzy-wrapper.jks.b64')
def generatedSigningKey = file("$buildDir/generated/signing/vizzy-wrapper.jks")
if (!generatedSigningKey.exists()) {
    generatedSigningKey.parentFile.mkdirs()
    generatedSigningKey.bytes = Base64.decoder.decode(encodedSigningKey.text.trim())
}

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'dev.alastorkaneki.vizzywrapper'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.alastorkaneki.vizzywrapper'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.0.0-alpha2'

        buildConfigField 'String', 'HOME_URL', '"https://vizzy.io/editor"'
    }

    signingConfigs {
        release {
            storeFile generatedSigningKey
            storePassword 'VizzyWrapper-Install-Key-2026'
            keyAlias 'vizzywrapper'
            keyPassword 'VizzyWrapper-Install-Key-2026'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

def applyLrcPickerRepair = tasks.register('applyLrcPickerRepair') {
    doLast {
        def activity = file('src/main/java/dev/alastorkaneki/vizzywrapper/MainActivity.java')
        def source = activity.getText('UTF-8')
        def original = source

        source = source.replace(
                'openDocument(PICK_LRC, "text/*", new String[]{"text/plain", "application/octet-stream"});',
                'openDocument(PICK_LRC, "*/*", null);'
        )

        source = source.replace('''    private void openDocument(int requestCode, String type, String[] mimeTypes) {
        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                .addCategory(Intent.CATEGORY_OPENABLE)
                .setType(type)
                .putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
        startActivityForResult(intent, requestCode);
    }
''', '''    private void openDocument(int requestCode, String type, String[] mimeTypes) {
        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                .addCategory(Intent.CATEGORY_OPENABLE)
                .setType(type)
                .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
        if (mimeTypes != null && mimeTypes.length > 0) {
            intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
        }
        startActivityForResult(intent, requestCode);
    }
''')

        source = source.replace('''            LrcParser.Result result = LrcParser.parse(input);
            project.lyrics.clear();
''', '''            LrcParser.Result result = LrcParser.parse(input);
            if (result.lines.isEmpty()) {
                throw new IllegalArgumentException("No timed lyric lines were found. Select an LRC file containing timestamps such as [00:12.34].");
            }
            project.lyrics.clear();
''')

        if (source.contains('openDocument(PICK_LRC, "text/*"')) {
            throw new GradleException('LRC picker MIME repair did not apply')
        }
        if (!source.contains('No timed lyric lines were found.')) {
            throw new GradleException('LRC content validation did not apply')
        }

        if (source != original) {
            activity.setText(source, 'UTF-8')
        }

        if (System.getenv('GITHUB_ACTIONS') == 'true' && source != original) {
            def run = { List<String> command ->
                def process = new ProcessBuilder(command)
                        .directory(rootProject.projectDir)
                        .inheritIO()
                        .start()
                def exit = process.waitFor()
                if (exit != 0) throw new GradleException("Command failed (${exit}): ${command.join(' ')}")
            }
            run(['git', 'config', 'user.name', 'github-actions[bot]'])
            run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
            run(['git', 'add', 'app/src/main/java/dev/alastorkaneki/vizzywrapper/MainActivity.java', 'app/build.gradle'])

            def diff = new ProcessBuilder(['git', 'diff', '--cached', '--quiet'])
                    .directory(rootProject.projectDir)
                    .inheritIO()
                    .start()
            def diffExit = diff.waitFor()
            if (diffExit != 0) {
                run(['git', 'commit', '-m', 'Fix LRC imports across Android file providers'])
                run(['git', 'push', 'origin', 'HEAD:agent/native-editor-foundation'])
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn applyLrcPickerRepair
}
