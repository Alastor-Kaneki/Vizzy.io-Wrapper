name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Apply LRC picker repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          activity = Path('app/src/main/java/dev/alastorkaneki/vizzywrapper/MainActivity.java')
          text = activity.read_text()

          old_picker = 'openDocument(PICK_LRC, "text/*", new String[]{"text/plain", "application/octet-stream"});'
          if old_picker in text:
              text = text.replace(old_picker, 'openDocument(PICK_LRC, "*/*", null);')

          old_method = '''    private void openDocument(int requestCode, String type, String[] mimeTypes) {
        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                .addCategory(Intent.CATEGORY_OPENABLE)
                .setType(type)
                .putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
        startActivityForResult(intent, requestCode);
    }
'''
          new_method = '''    private void openDocument(int requestCode, String type, String[] mimeTypes) {
        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                .addCategory(Intent.CATEGORY_OPENABLE)
                .setType(type)
                .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
        if (mimeTypes != null && mimeTypes.length > 0) {
            intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
        }
        startActivityForResult(intent, requestCode);
    }
'''
          if old_method in text:
              text = text.replace(old_method, new_method)

          old_parse = '''            LrcParser.Result result = LrcParser.parse(input);
            project.lyrics.clear();
'''
          new_parse = '''            LrcParser.Result result = LrcParser.parse(input);
            if (result.lines.isEmpty()) {
                throw new IllegalArgumentException("No timed lyric lines were found. Select an LRC file containing timestamps such as [00:12.34].");
            }
            project.lyrics.clear();
'''
          if old_parse in text:
              text = text.replace(old_parse, new_parse)

          if 'openDocument(PICK_LRC, "text/*"' in text:
              raise SystemExit('LRC picker repair did not replace every filtered picker call')
          if '.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);\n        startActivityForResult' in text:
              raise SystemExit('openDocument still writes a null MIME filter unconditionally')
          if 'No timed lyric lines were found.' not in text:
              raise SystemExit('LRC content validation was not inserted')
          activity.write_text(text)

          gradle = Path('app/build.gradle')
          text = gradle.read_text()
          text = text.replace('versionCode 3', 'versionCode 4')
          text = text.replace("versionName '2.0.0-alpha1'", "versionName '2.0.0-alpha2'")
          gradle.write_text(text)

          readme = Path('README.md')
          text = readme.read_text().replace('2.0.0-alpha1', '2.0.0-alpha2')
          readme.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/alastorkaneki/vizzywrapper/MainActivity.java app/build.gradle README.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix LRC imports across Android file providers"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Vizzy.io-Native-v2.0.0-alpha2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizzy.io-Native-v2.0.0-alpha2
          path: Vizzy.io-Native-v2.0.0-alpha2.apk
          if-no-files-found: error
          retention-days: 90
