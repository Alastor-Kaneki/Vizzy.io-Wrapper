name: Apply native editor source

on:
  push:
    branches: [ agent/native-editor-foundation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/native-editor-patch.ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-editor-foundation
          fetch-depth: 0
      - name: Apply native source archive
        run: |
          cat .github/native-editor-patch.part-* | base64 --decode > /tmp/native-editor-patch.tar.gz
          echo "d5c1f4fe9970427224bd570d4d1d54713b7bacee1a5af06e2615d6369a392111  /tmp/native-editor-patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/native-editor-patch.tar.gz -C .
          rm -f .github/native-editor-patch.part-* .github/native-editor-patch.ready
          rm -f .github/workflows/apply-native-editor.yml
          rm -f .github/workflows/source-snapshot.yml
          rm -f .github/native-editor-source-snapshot .github/native-editor-source-export
      - name: Commit expanded native editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build native Android audiovisual editor"
          git push origin HEAD:agent/native-editor-foundation
