name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Vizzy.io-Native-v2.0.0-alpha1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizzy.io-Native-v2.0.0-alpha1
          path: Vizzy.io-Native-v2.0.0-alpha1.apk
          if-no-files-found: error
          retention-days: 90
